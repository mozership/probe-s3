# probe-s3 built from this checkout, for e2e/workflow.yml. Probe resolves an
# action before the first job starts, so the executable is built before
# probe runs:
#
#   go build -o e2e/action/probe-s3 . && probe --allow-host localhost --allow-action shell e2e/workflow.yml
name: s3
description: Read and write objects in S3 and S3-compatible storage
guard: [read-only, allow-host]
params: [get, head, list, put, delete, bucket, region, endpoint, path_style, access_key_id, secret_access_key, session_token, body, file, content_type, metadata, max_keys, timeout]
runs:
  using: binary
  path: probe-s3
